# Replace paths with real clean checkouts. No remote fetch occurs automatically.
state_directory = "/var/lib/charisma/runs"
interval_seconds = 900
production = true

[[projects]]
name = "website"
path = "/srv/projects/website"
platform = "web"
mode = "scan"
tests = ["npm test", "npm run build"]
publish = false
# Required before switching web/Android projects to mode = "repair":
# test_image = "your-prepared-image@sha256:REPLACE_WITH_64_HEX_DIGEST"
# repository = "your-account/website"


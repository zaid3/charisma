name: Production candidate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true
jobs:
  containers:
    name: Gateway and container integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build production image
        run: docker build -f deploy/Dockerfile -t charisma-under-test .
      - name: Start isolated fixture gateway
        run: |
          mkdir -p /tmp/charisma-container-state
          sudo chown 10001:10001 /tmp/charisma-container-state
          docker network create --internal charisma-fixture
          docker run -d --name monitor --network charisma-fixture --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp -p 127.0.0.1:18787:8787 -v /tmp/charisma-container-state:/data -v "$PWD/tests/integration/server.toml:/etc/charisma/server.toml:ro" -e CHARISMA_ADMIN_TOKEN=integration-admin-token-32-characters -e CHARISMA_GATEWAY_TOKEN=integration-gateway-token-32-characters -e CHARISMA_AUDIT_KEY=integration-independent-audit-key-32-characters charisma-under-test
          docker run -d --name proxy --network charisma-fixture -p 127.0.0.1:18080:8080 -p 127.0.0.1:18081:8081 -v "$PWD/tests/integration/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.7-alpine
      - name: Wait for readiness and verify gateway controls
        run: |
          python - <<'PY'
          import time,urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:18787/ready',timeout=2)
                  break
              except Exception:
                  if attempt==29: raise
                  time.sleep(1)
          PY
          python tests/integration/check_gateway.py
      - name: Verify configured test isolation
        run: |
          docker pull python:3.12-slim
          export CHARISMA_TEST_IMAGE="$(docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}')"
          python tests/integration/check_sandbox.py
      - name: Validate production proxy configuration
        run: docker run --rm -e MONITOR_DOMAIN=monitor.fixture.test -e APP_DOMAIN=app.fixture.test -e APP_UPSTREAM=application:8080 -e CHARISMA_GATEWAY_TOKEN=fixture-token -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.7-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Capture diagnostics
        if: always()
        run: |
          mkdir -p production-evidence
          docker logs monitor > production-evidence/monitor.log 2>&1 || true
          docker logs proxy > production-evidence/proxy.log 2>&1 || true
          docker image inspect charisma-under-test --format '{{.Id}}' > production-evidence/image-id.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-integration-evidence
          path: production-evidence/
          retention-days: 14
  postgres:
    name: PostgreSQL scope isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-password-for-local-ci
          POSTGRES_DB: fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify restrictive policies against a real database
        env:
          PGPASSWORD: fixture-password-for-local-ci
        run: psql -h 127.0.0.1 -U postgres -d fixture -f tests/integration/postgres.sql
  ios:
    name: iOS SDK and simulator build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift SDK
        working-directory: sdk/ios
        run: swift test
      - name: Compile for iOS Simulator without signing
        working-directory: sdk/ios
        run: xcodebuild -scheme CharismaMonitor -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/charisma-derived CODE_SIGNING_ALLOWED=NO build
  android:
    name: Android SDK compile and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test Java SDK
        run: |
          mkdir -p /tmp/charisma-java
          javac --release 8 -d /tmp/charisma-java sdk/android/src/main/java/io/charisma/CharismaMonitor.java sdk/android/src/test/java/io/charisma/CharismaMonitorTest.java
          java -cp /tmp/charisma-java io.charisma.CharismaMonitorTest
      - name: Compile against Android and produce DEX
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          mkdir -p /tmp/charisma-android /tmp/charisma-dex
          javac -source 8 -target 8 -bootclasspath "$ANDROID_HOME/platforms/android-35/android.jar" -d /tmp/charisma-android sdk/android/src/main/java/io/charisma/CharismaMonitor.java
          jar cf /tmp/charisma-android-sdk.jar -C /tmp/charisma-android .
          "$ANDROID_HOME/build-tools/35.0.0/d8" --lib "$ANDROID_HOME/platforms/android-35/android.jar" --min-api 21 --output /tmp/charisma-dex /tmp/charisma-android-sdk.jar
      - uses: actions/upload-artifact@v4
        with:
          name: android-monitor-sdk
          path: /tmp/charisma-android-sdk.jar
          retention-days: 14
